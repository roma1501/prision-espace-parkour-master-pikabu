<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Побег из тюрьмы: мастер паркура</title>
    <link rel="icon" type="image/png" href="assets/branding/lory-engine.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            background: #101318 url('assets/ui/loading_bg.webp?v=0.1.2-cb3ad3df') center / cover no-repeat;
            z-index: 1000;
            justify-content: flex-end;
            padding-bottom: max(6vh, 28px);
        }
        #loading-screen::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,12,16,0) 35%, rgba(10,12,16,.82) 100%); pointer-events: none; }
        #loading-screen > * { position: relative; }
        @media (orientation: portrait) { #loading-screen { background-image: url('assets/ui/loading_bg_portrait.webp?v=0.1.2-cb3ad3df'); } }
        .pe-logo-load { width: min(560px, 82vw); max-height: 30vh; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
        #loading-screen #loading-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
        .loading-text {
            font: 700 14px system-ui, sans-serif;
            color: #f4f1ea;
            text-shadow: 0 2px 0 #000;
            text-align: center;
            min-height: 1em;
        }
        .loading-bar {
            width: min(360px, 74vw);
            height: 16px;
            background: #23262b;
            border: 3px solid #14161a;
            border-radius: 3px;
            box-shadow: 0 4px 0 #0b0c0e;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(-45deg, #f2c230 0 12px, #1d1d1f 12px 24px);
            transition: width 0.3s ease;
        }
        #loading-title { margin: 0; font: 800 clamp(22px, 5vw, 38px)/1.15 system-ui, sans-serif; color: #eef3df; text-align: center; max-width: 86vw; }
        .engine-mark { width: clamp(72px, 14vh, 140px); height: clamp(72px, 14vh, 140px); object-fit: contain; }
        #loading-percent { font: 900 18px system-ui, sans-serif; color: #f07d1e; text-shadow: 0 2px 0 #000; }
        #loading-retry { padding: 12px 24px; border: 0; border-radius: 4px; background: #75dbc0; color: #10231e; font: 700 16px system-ui, sans-serif; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <img class="pe-logo-load" src="assets/ui/logo-pikabu.webp" alt="" aria-hidden="true">
        <h1 id="loading-title">Lory Engine</h1>
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <!-- Порядок значим: Constants.js первым (остальные читают его глобалы), main.js последним -->
    <script src="https://games.pikabu.ru/sdk/sdk.js"></script>
<script src="js/Constants.js?v=0.1.2-cb3ad3df"></script>
    <!-- 1.40 ads-ui: поле игры на десктопе не шире 2:1 (Playgama); вторым — его resize идёт раньше обработчиков движка -->
    <script src="js/ViewCap.js?v=0.1.2-cb3ad3df"></script>
    <script src="libs/simplex-noise.js?v=0.1.2-cb3ad3df"></script>
    <script src="libs/babylon.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Maps.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Maps2D.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/World2D.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/World3D.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Terrain3D.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/CameraControl.js?v=0.1.2-cb3ad3df"></script>
    <!-- 1.40: камера не заслоняется сценой (столкновение, полупрозрачные заслоны) -->
    <script src="js/CameraSight.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Model3D.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ModelFBX.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ModelOBJ.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ModelGLTF.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Location3D.js?v=0.1.2-cb3ad3df"></script>
    <!-- world-a: Rig.js (риги и клипы), Nav.js (коллизии, высоты, пути) -->
    <script src="js/Rig.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Nav.js?v=0.1.2-cb3ad3df"></script>
    <!-- 1.30 мир (world-b): уровни графики и время суток -->
    <script src="js/Quality.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Sky3D.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Pause.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Sound.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Lang.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Platform.js?v=0.1.2-cb3ad3df"></script>
    <!-- Адаптеры площадок (Platform.register): Playgama; игра добавляет свои здесь же, после Platform.js -->
    <script src="js/PlatformPlaygama.js?v=0.1.2-cb3ad3df"></script>
    <!-- Адаптеры Telegram Mini App, CrazyGames, Android-обёртки и сборки test (detect() выбирает площадку) -->
    <script src="js/PlatformTelegram.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/PlatformCrazy.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/PlatformPikabu.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/PlatformAndroid.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/PlatformTest.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/LoadingScreen.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ParticleFX.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Telemetry.js?v=0.1.2-cb3ad3df"></script>
    <!-- 1.30 systems-b: магазин косметики, Daily Gift, колесо фортуны (логика без UI, опт-ин: Shop/DailyGift/Wheel.init в Game.js) -->
    <script src="js/Shop.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/DailyGift.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Wheel.js?v=0.1.2-cb3ad3df"></script>
    <!-- 1.30 systems-a: ввод, раскладка HUD, обучение. Opt-in: игра сама зовёт Input.init / HudLayout.init / Tutorial.init -->
    <script src="js/HudLayout.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Input.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Tutorial.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/LiveWater3D.js?v=0.1.2-cb3ad3df"></script>
    <!-- 1.40 motion: физический блочный персонаж (opt-in). Порядок значим: MotionMath (GM) -> Humanoid -> MotionMatch -> CharacterPhysics -> Ragdoll -> Character -->
    <script src="js/MotionMath.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Humanoid.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/MotionMatch.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/CharacterPhysics.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Ragdoll.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Character.js?v=0.1.2-cb3ad3df"></script>
    <!-- 1.40 obby (ветка obby): трасса из деталей карты, тело героя, боты и их чат, вид. Опт-ин: игра сама зовёт ObbyCourse.build / ObbyBots.init -->
    <script src="js/ObbyCourse.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ObbyBody.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ObbyChat.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ObbyBots.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ObbyCourseView.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/ObbyAvatar.js?v=0.1.2-cb3ad3df"></script>
    <!-- Скрипты игры (js/Game.js и её модули) — здесь, до main.js -->
    <script src="js/GameSurfaces.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameLevelData.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameShopData.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameLook.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameShopUI.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameRewardsData.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameMetaUI.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameAudio.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameFx.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameHud.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameHero.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameMech.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/GameGuard.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/Game.js?v=0.1.2-cb3ad3df"></script>
    <script src="js/main.js?v=0.1.2-cb3ad3df"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
</body>
</html>
